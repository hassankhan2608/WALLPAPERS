name: Publish wallpaper catalog

on:
  push:
    branches: [main]
    paths:
      - "Wallpapers/**"
      - ".github/scripts/generate_catalog.py"
      - ".github/workflows/publish-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and image history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Restore generated metadata and thumbnails
        uses: actions/cache@v4
        with:
          path: .wallpaper-cache
          key: ${{ runner.os }}-wallpaper-catalog-v2-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-wallpaper-catalog-v2-

      - name: Install image tooling
        run: |
          sudo apt-get update && sudo apt-get install --yes imagemagick
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Generate catalog and README
        env:
          PAGES_BASE_URL: https://hassankhan2608.github.io/WALLPAPERS
        run: python .github/scripts/generate_catalog.py

      - name: Commit refreshed README
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh wallpaper thumbnail index"
          git push

      - name: Deploy catalog to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .wallpaper-catalog
          publish_branch: gh-pages
          force_orphan: true
