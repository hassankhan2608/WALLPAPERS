name: Publish wallpaper catalog

on:
  push:
    branches: [main]
    paths:
      - "Wallpapers/**"
      - ".github/scripts/generate_catalog.py"
      - ".github/workflows/publish-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository and image history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Restore generated metadata and thumbnails
        uses: actions/cache@v4
        with:
          path: .wallpaper-cache
          key: ${{ runner.os }}-wallpaper-catalog-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-wallpaper-catalog-

      - name: Install image tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvips-tools
          python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Generate catalog
        env:
          PAGES_BASE_URL: https://hassankhan2608.github.io/WALLPAPERS
        run: python .github/scripts/generate_catalog.py

      - name: Commit refreshed README
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh wallpaper thumbnail index"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload catalog artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .wallpaper-catalog

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy catalog to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
